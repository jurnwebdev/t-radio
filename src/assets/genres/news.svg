<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="nw-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="nw-bottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="240" fill="#0A0F1D"/>
  <rect width="400" height="240" fill="url(#nw-glow)"/>

  <!-- World Map Grid Lines (News style) -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.25" fill="none">
    <circle cx="280" cy="90" r="70"/>
    <ellipse cx="280" cy="90" rx="70" ry="25"/>
    <ellipse cx="280" cy="90" rx="35" ry="70"/>
    <line x1="210" y1="90" x2="350" y2="90"/>
    <line x1="280" y1="20" x2="280" y2="160"/>
  </g>

  <!-- Newspaper / News Paper Fold Graphic at angle -->
  <g transform="rotate(-6 140 100)" opacity="0.85">
    <!-- Paper base -->
    <rect x="50" y="30" width="160" height="110" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Big Headline "NEWS" -->
    <text x="62" y="58" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="900" fill="#F8FAFC" letter-spacing="1">DAILY NEWS</text>
    <line x1="62" y1="65" x2="198" y2="65" stroke="#94A3B8" stroke-width="2"/>
    <!-- News columns lines -->
    <g fill="#64748B">
      <rect x="62" y="73" width="60" height="4" rx="2"/>
      <rect x="62" y="81" width="55" height="3" rx="1.5"/>
      <rect x="62" y="87" width="58" height="3" rx="1.5"/>
      <rect x="62" y="93" width="50" height="3" rx="1.5"/>
      <rect x="62" y="99" width="56" height="3" rx="1.5"/>
      <rect x="62" y="105" width="45" height="3" rx="1.5"/>
      
      <!-- Right sub-column with small photo block -->
      <rect x="130" y="73" width="68" height="30" rx="2" fill="#334155"/>
      <rect x="130" y="108" width="65" height="3" rx="1.5"/>
      <rect x="130" y="114" width="58" height="3" rx="1.5"/>
      <rect x="130" y="120" width="62" height="3" rx="1.5"/>
      <rect x="130" y="126" width="50" height="3" rx="1.5"/>
    </g>
  </g>

  <!-- Broadcast On-Air Live Signal Rings -->
  <g stroke="#EF4444" stroke-width="2" fill="none" opacity="0.6">
    <circle cx="45" cy="50" r="12"/>
    <circle cx="45" cy="50" r="22" stroke-dasharray="3 3"/>
  </g>
  <circle cx="45" cy="50" r="4" fill="#EF4444"/>

  <!-- Dark gradient bottom -->
  <rect width="400" height="240" fill="url(#nw-bottom)"/>
</svg>
