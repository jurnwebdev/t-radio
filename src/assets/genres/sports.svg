<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sp-light" cx="70%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#166534" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#021E0F" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="sp-turf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
    <radialGradient id="sp-ball" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="90%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
    <linearGradient id="sp-bottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <!-- Background atmosphere -->
  <rect width="400" height="240" fill="#02190B"/>
  <rect width="400" height="240" fill="url(#sp-light)"/>

  <!-- Stadium Floodlight Beams -->
  <polygon points="300,0 120,240 180,240" fill="#BBF7D0" opacity="0.18"/>
  <polygon points="300,0 240,240 310,240" fill="#BBF7D0" opacity="0.25"/>
  <circle cx="300" cy="15" r="15" fill="#DCFCE7" opacity="0.9"/>
  <circle cx="300" cy="15" r="45" fill="#4ADE80" opacity="0.3" filter="blur(15px)"/>

  <!-- Grass pitch curved horizon -->
  <path d="M0,135 Q200,120 400,135 L400,240 L0,240 Z" fill="url(#sp-turf)"/>
  
  <!-- Turf striped field lines -->
  <path d="M0,170 Q200,155 400,170 L400,200 Q200,185 0,200 Z" fill="#14532D" opacity="0.4"/>
  <!-- Field white line -->
  <path d="M0,165 Q200,145 400,160" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.4"/>

  <!-- Soccer Ball Shadow -->
  <ellipse cx="230" cy="175" rx="46" ry="14" fill="#021408" opacity="0.8"/>

  <!-- Soccer Ball Graphic -->
  <g transform="translate(185, 80)">
    <!-- Ball Sphere -->
    <circle cx="45" cy="45" r="44" fill="url(#sp-ball)"/>

    <!-- Black Pentagons pattern -->
    <!-- Center pentagon -->
    <polygon points="45,30 57,39 52,54 38,54 33,39" fill="#0F172A"/>
    
    <!-- Top patch -->
    <polygon points="45,1 55,10 45,18 35,10" fill="#0F172A"/>
    <line x1="45" y1="18" x2="45" y2="30" stroke="#0F172A" stroke-width="2.5"/>

    <!-- Top right patch -->
    <polygon points="82,24 88,36 78,44 70,34" fill="#0F172A"/>
    <line x1="57" y1="39" x2="70" y2="34" stroke="#0F172A" stroke-width="2.5"/>

    <!-- Bottom right patch -->
    <polygon points="76,72 65,82 58,74 68,64" fill="#0F172A"/>
    <line x1="52" y1="54" x2="68" y2="64" stroke="#0F172A" stroke-width="2.5"/>

    <!-- Bottom left patch -->
    <polygon points="14,72 25,82 32,74 22,64" fill="#0F172A"/>
    <line x1="38" y1="54" x2="22" y2="64" stroke="#0F172A" stroke-width="2.5"/>

    <!-- Top left patch -->
    <polygon points="8,24 2,36 12,44 20,34" fill="#0F172A"/>
    <line x1="33" y1="39" x2="20" y2="34" stroke="#0F172A" stroke-width="2.5"/>

    <!-- Specular highlight on sphere -->
    <ellipse cx="32" cy="24" rx="14" ry="8" fill="#FFFFFF" opacity="0.45" transform="rotate(-25 32 24)"/>
  </g>

  <!-- Dark gradient bottom -->
  <rect width="400" height="240" fill="url(#sp-bottom)"/>
</svg>
