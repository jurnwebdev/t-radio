<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="tk-glow" cx="65%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#451A03" stop-opacity="0.75"/>
      <stop offset="90%" stop-color="#0F0602" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="tk-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="tk-goldrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="tk-bottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="240" fill="#0C0401"/>
  <rect width="400" height="240" fill="url(#tk-glow)"/>

  <!-- Warm studio bokeh orbs -->
  <circle cx="90" cy="60" r="30" fill="#F59E0B" opacity="0.15" filter="blur(12px)"/>
  <circle cx="160" cy="110" r="45" fill="#D97706" opacity="0.12" filter="blur(16px)"/>
  <circle cx="330" cy="50" r="35" fill="#F59E0B" opacity="0.2" filter="blur(14px)"/>

  <!-- Boom Arm Silhouette from top right -->
  <line x1="380" y1="-20" x2="260" y2="70" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
  <line x1="380" y1="-20" x2="260" y2="70" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <circle cx="260" cy="70" r="14" fill="#0F172A" stroke="#475569" stroke-width="3"/>
  <circle cx="260" cy="70" r="5" fill="#F59E0B"/>

  <!-- Shockmount & Capsule connector -->
  <line x1="260" y1="70" x2="210" y2="100" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>

  <!-- Shockmount Outer Ring -->
  <ellipse cx="200" cy="115" rx="36" ry="24" fill="none" stroke="#64748B" stroke-width="3.5" transform="rotate(-15 200 115)"/>
  <!-- Shockmount elastic suspension cords -->
  <line x1="172" y1="105" x2="185" y2="112" stroke="#F59E0B" stroke-width="1.8" opacity="0.8"/>
  <line x1="228" y1="125" x2="215" y2="118" stroke="#F59E0B" stroke-width="1.8" opacity="0.8"/>

  <!-- Studio Condenser Microphone Body (Angled) -->
  <g transform="rotate(-15 200 115)">
    <!-- Lower body cylinder -->
    <rect x="186" y="110" width="28" height="42" rx="4" fill="url(#tk-metal)"/>
    <!-- Gold accent ring -->
    <rect x="185" y="106" width="30" height="4" rx="1.5" fill="url(#tk-goldrim)"/>
    <!-- Microphone Upper Grille Capsule -->
    <rect x="187" y="65" width="26" height="40" rx="13" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Grille Mesh lines -->
    <g stroke="#94A3B8" stroke-width="0.8" opacity="0.6">
      <line x1="189" y1="73" x2="211" y2="73"/>
      <line x1="188" y1="79" x2="212" y2="79"/>
      <line x1="188" y1="85" x2="212" y2="85"/>
      <line x1="188" y1="91" x2="212" y2="91"/>
      <line x1="189" y1="97" x2="211" y2="97"/>
      <!-- Vertical mesh center support -->
      <line x1="200" y1="65" x2="200" y2="105" stroke="#F59E0B" stroke-width="1.5" opacity="0.9"/>
    </g>
  </g>

  <!-- Sound speech waves radiating from mic -->
  <g stroke="#F59E0B" stroke-width="1.8" fill="none" opacity="0.4" stroke-linecap="round">
    <path d="M140,80 A35,35 0 0,0 125,130"/>
    <path d="M120,65 A55,55 0 0,0 100,145"/>
    <path d="M100,50 A75,75 0 0,0 75,160"/>
  </g>

  <!-- Dark gradient bottom -->
  <rect width="400" height="240" fill="url(#tk-bottom)"/>
</svg>
