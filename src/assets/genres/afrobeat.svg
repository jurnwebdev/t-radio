<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="ag-spot" cx="50%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#FF9E1B" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#E65100" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#140602" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="ag-ray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ag-bottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="60%" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background atmosphere -->
  <rect width="400" height="240" fill="#1A0A03"/>
  <rect width="400" height="240" fill="url(#ag-spot)"/>
  
  <!-- Stage light beams -->
  <polygon points="200,0 70,240 130,240" fill="url(#ag-ray)" opacity="0.6"/>
  <polygon points="200,0 270,240 330,240" fill="url(#ag-ray)" opacity="0.6"/>
  <polygon points="200,0 170,240 230,240" fill="url(#ag-ray)" opacity="0.8"/>
  <polygon points="120,0 0,180 50,240" fill="url(#ag-ray)" opacity="0.4"/>
  <polygon points="280,0 350,240 400,180" fill="url(#ag-ray)" opacity="0.4"/>

  <!-- Dust / particle motes -->
  <circle cx="160" cy="80" r="3" fill="#FFE082" opacity="0.6"/>
  <circle cx="240" cy="65" r="2.5" fill="#FFE082" opacity="0.7"/>
  <circle cx="190" cy="110" r="2" fill="#FFE082" opacity="0.5"/>
  <circle cx="120" cy="130" r="1.5" fill="#FFE082" opacity="0.4"/>
  <circle cx="280" cy="95" r="2" fill="#FFE082" opacity="0.6"/>
  <circle cx="210" cy="40" r="4" fill="#FFF8E1" opacity="0.8"/>

  <!-- Crowd silhouette with raised hands -->
  <path d="M0,240 L0,185 Q20,175 40,182 Q55,160 62,145 Q65,142 68,146 Q70,165 80,178 Q95,155 102,135 Q106,132 109,136 Q112,158 125,172 Q140,150 148,128 Q152,125 155,129 Q158,150 172,168 Q188,142 195,120 Q199,118 203,122 Q208,148 222,166 Q238,138 246,115 Q250,112 254,116 Q258,142 272,168 Q288,146 295,125 Q299,122 303,126 Q308,152 322,172 Q338,155 346,135 Q350,132 354,136 Q358,160 375,180 Q390,172 400,182 L400,240 Z" fill="#080301"/>
  
  <!-- Additional detailed hand silhouettes -->
  <!-- Left hand -->
  <path d="M58,165 C55,150 56,138 60,132 C62,130 65,131 65,135 C64,142 63,150 66,165 Z" fill="#060201"/>
  <path d="M100,155 C98,140 100,125 104,120 C106,118 108,120 108,124 C106,132 105,142 108,155 Z" fill="#060201"/>
  <!-- Center hands reaching up (peace/horns) -->
  <path d="M194,145 C190,130 191,112 194,106 C196,104 198,105 198,109 C197,118 196,128 200,145 Z" fill="#060201"/>
  <path d="M204,145 C206,130 205,112 208,106 C210,104 212,105 212,109 C210,118 209,128 207,145 Z" fill="#060201"/>
  <path d="M246,140 C242,125 243,108 247,102 C249,100 251,101 251,105 C249,114 248,124 252,140 Z" fill="#060201"/>
  <!-- Right hands -->
  <path d="M294,150 C290,135 292,118 296,112 C298,110 300,111 300,115 C298,124 297,134 301,150 Z" fill="#060201"/>
  <path d="M344,158 C340,145 342,128 346,122 C348,120 350,121 350,125 C348,134 347,144 351,158 Z" fill="#060201"/>

  <!-- Dark bottom gradient overlay for readability -->
  <rect width="400" height="240" fill="url(#ag-bottom)"/>
</svg>
